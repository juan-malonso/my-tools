<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MultiScreen Cropper</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- interact.js -->
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gray: {
                850: '#1f2937',
                900: '#111827',
                950: '#0b0f19'
              }
            }
          }
        }
      };
    </script>

    <style>
      body {
        overscroll-behavior: none;
      }
      #preview-container {
        background-image:
          linear-gradient(45deg, #1f2937 25%, transparent 25%),
          linear-gradient(-45deg, #1f2937 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #1f2937 75%),
          linear-gradient(-45deg, transparent 75%, #1f2937 75%);
        background-size: 20px 20px;
        background-position:
          0 0,
          0 10px,
          10px -10px,
          -10px 0px;
        touch-action: none;
        user-select: none;
      }
      .monitor {
        position: absolute;
        border: 2px solid #3b82f6;
        background-color: rgba(59, 130, 246, 0.1);
        touch-action: none;
        user-select: none;
        box-sizing: border-box;
      }
      .monitor .handle {
        position: absolute;
        bottom: 5px;
        right: 5px;
        width: 15px;
        height: 15px;
        background: #3b82f6;
        cursor: se-resize;
      }
      .monitor .download-btn {
        position: absolute;
        top: 5px;
        right: 5px;
        background-color: #3b82f6;
        color: white;
        padding: 2px 5px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 12px;
      }
      .monitor .delete-btn {
        position: absolute;
        top: 5px;
        left: 5px;
        background-color: #ef4444;
        color: white;
        width: 20px;
        height: 20px;
        text-align: center;
        line-height: 20px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 12px;
      }
      .monitor .monitor-controls {
        position: absolute;
        bottom: 5px;
        left: 5px;
        display: flex;
        gap: 5px;
        background: rgba(0, 0, 0, 0.5);
        padding: 5px;
        border-radius: 5px;
      }
      .monitor .monitor-controls select,
      .monitor .monitor-controls input {
        background-color: #1f2937;
        color: white;
        border: 1px solid #3b82f6;
        border-radius: 3px;
        font-size: 12px;
        padding: 2px;
      }
      .monitor .monitor-controls input {
        width: 50px;
      }
      .monitor .dimensions {
        color: white;
        font-size: 12px;
        align-self: center;
        margin-left: 10px;
        white-space: nowrap;
      }
      .monitor .monitor-label {
        position: absolute;
        top: 5px;
        left: 5px;
        background-color: rgba(0, 0, 0, 0.5);
        color: white;
        padding: 2px 5px;
        border-radius: 3px;
        font-size: 12px;
      }
    </style>
  </head>
  <body class="bg-gray-950 text-gray-100 h-screen flex flex-col overflow-hidden font-sans">
    <!-- Header -->
    <header
      class="bg-gray-900 border-b border-gray-800 p-4 flex justify-between items-center shadow-md z-10"
    >
      <div class="flex items-center gap-2">
        <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
          ></path>
        </svg>
        <h1 class="text-xl font-bold tracking-tight">
          MultiScreen<span class="text-blue-500">Cropper</span>
        </h1>
      </div>
    </header>

    <div class="flex flex-1 h-full overflow-hidden">
      <!-- Sidebar Controls -->
      <aside class="w-80 bg-gray-900 border-r border-gray-800 flex flex-col z-10 shadow-lg">
        <div class="flex-grow p-6 space-y-8 overflow-y-auto">
          <!-- Upload Section -->
          <div id="upload-section" class="space-y-3">
            <h2 class="text-sm uppercase text-gray-500 font-semibold tracking-wider">1. Image</h2>
            <div
              id="dropZone"
              class="border-2 border-dashed border-gray-700 rounded-xl p-6 text-center hover:border-blue-500 hover:bg-gray-800 transition-all cursor-pointer group"
            >
              <input type="file" id="fileInput" class="hidden" accept="image/*" />
              <div class="text-gray-400 group-hover:text-blue-400 mb-2">
                <svg
                  class="w-10 h-10 mx-auto"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
                  ></path>
                </svg>
              </div>
              <p class="text-sm text-gray-300">
                Drag and drop an image or
                <span class="text-blue-500 font-medium">click to browse</span>
              </p>
              <p class="text-xs text-gray-500 mt-1">JPG, PNG, WEBP</p>
            </div>
          </div>

          <!-- Image Controls Section -->
          <div id="image-controls" class="space-y-3" style="display: none">
            <h2 class="text-sm uppercase text-gray-500 font-semibold tracking-wider">1. Image</h2>
            <div class="bg-gray-800 rounded-lg p-3 space-y-3">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2 overflow-hidden">
                  <svg
                    class="w-5 h-5 text-gray-400 flex-shrink-0"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                  >
                    <path
                      d="M19,2H5C3.897,2,3,2.897,3,4v16c0,1.103,0.897,2,2,2h14c1.103,0,2-0.897,2-2V4C21,2.897,20.103,2,19,2z M5,20V4h14l0.002,16H5z"
                    ></path>
                    <path d="M10 14.586l-3-3-2 2V18h14v-5l-4-4z"></path>
                  </svg>
                  <span id="image-name" class="text-sm text-gray-300 font-medium truncate"
                    >image.jpg</span
                  >
                </div>
                <button
                  id="remove-image-btn"
                  class="text-gray-500 hover:text-red-500 p-1 rounded-full hover:bg-gray-700 transition-colors"
                >
                  <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                    <path
                      fill-rule="evenodd"
                      d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                      clip-rule="evenodd"
                    ></path>
                  </svg>
                </button>
              </div>
              <div class="space-y-2">
                <label for="zoomRange" class="text-xs text-gray-400">Zoom</label>
                <div class="flex items-center gap-2">
                  <input
                    type="range"
                    id="zoomRange"
                    class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer"
                    min="10"
                    max="500"
                    value="100"
                  />
                  <input
                    type="number"
                    id="zoomInput"
                    class="w-20 bg-gray-900 border border-gray-700 rounded-md px-2 py-1 text-sm"
                    value="100"
                  />
                  <span class="text-gray-400 text-sm">%</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Add Monitor Section -->
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <h2 class="text-sm uppercase text-gray-500 font-semibold tracking-wider">
                2. Monitors
              </h2>
              <button
                id="addMonitorBtn"
                class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded-md text-xs font-medium transition-colors"
              >
                Add
              </button>
            </div>
            <div id="monitor-list" class="space-y-3 pt-2"></div>
          </div>
        </div>

        <!-- Instructions -->
        <div class="p-6 border-t border-gray-800">
          <div class="bg-gray-800/50 rounded-lg p-4 text-xs text-gray-400">
            <p class="font-semibold text-gray-300 mb-1">Controls:</p>
            <ul class="list-disc list-inside space-y-1">
              <li>Drag monitors to move them.</li>
              <li>Drag the background to pan the image.</li>
              <li>Scroll on the background to zoom.</li>
            </ul>
          </div>
        </div>
      </aside>

      <!-- Main Workspace -->
      <main
        id="preview-container"
        class="flex-1 relative bg-gray-950 flex items-center justify-center overflow-hidden"
      >
        <div id="image-background" class="absolute inset-0 bg-no-repeat bg-center"></div>
        <div
          id="emptyState"
          class="absolute inset-0 flex items-center justify-center pointer-events-none"
        >
          <p class="text-gray-600 text-lg font-medium">Upload an image to start</p>
        </div>
      </main>
    </div>

    <script>
      const state = {
        image: null,
        imageName: '',
        zoom: 1,
        panX: 0,
        panY: 0,
        monitors: []
      };

      const previewContainer = document.getElementById('preview-container');
      const imageBackground = document.getElementById('image-background');
      const emptyState = document.getElementById('emptyState');
      const dropZone = document.getElementById('dropZone');
      const fileInput = document.getElementById('fileInput');
      const addMonitorBtn = document.getElementById('addMonitorBtn');
      const uploadSection = document.getElementById('upload-section');
      const imageControls = document.getElementById('image-controls');
      const imageName = document.getElementById('image-name');
      const removeImageBtn = document.getElementById('remove-image-btn');
      const zoomInput = document.getElementById('zoomInput');
      const zoomRange = document.getElementById('zoomRange');
      const monitorList = document.getElementById('monitor-list');

      function handleFileSelect(e) {
        if (e.target.files && e.target.files.length > 0) {
          handleFile(e.target.files[0]);
        }
      }

      function handleFile(file) {
        if (!file.type.startsWith('image/')) return alert('Please upload a valid image file.');

        state.imageName = file.name;

        const reader = new FileReader();
        reader.onload = (e) => {
          state.image = new Image();
          state.image.onload = () => {
            state.zoom = 1;
            state.panX = 0;
            state.panY = 0;

            uploadSection.style.display = 'none';
            imageControls.style.display = 'block';
            imageName.textContent = state.imageName;
            emptyState.style.display = 'none';

            imageBackground.style.backgroundImage = `url(${e.target.result})`;
            updateBackgroundTransform();
            resetZoomControls();
          };
          state.image.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      function removeImage() {
        state.image = null;
        state.imageName = '';
        imageBackground.style.backgroundImage = 'none';

        uploadSection.style.display = 'block';
        imageControls.style.display = 'none';
        emptyState.style.display = 'flex';

        fileInput.value = '';
      }

      function updateBackgroundTransform() {
        if (!state.image) return;
        imageBackground.style.backgroundSize = `${
          state.zoom * state.image.width
        }px ${state.zoom * state.image.height}px`;
        imageBackground.style.backgroundPosition = `${state.panX}px ${state.panY}px`;
      }

      function setZoom(newZoom, fromInput = false) {
        const minZoom = parseFloat(zoomRange.min) / 100;
        const maxZoom = parseFloat(zoomRange.max) / 100;

        state.zoom = Math.max(minZoom, Math.min(maxZoom, newZoom));

        if (!fromInput) {
          zoomInput.value = (state.zoom * 100).toFixed(2);
          zoomRange.value = state.zoom * 100;
        }

        updateBackgroundTransform();
        state.monitors.forEach(logCropCoordinates);
      }

      function resetZoomControls() {
        zoomInput.value = 100;
        zoomRange.value = 100;
      }

      function addMonitor(config = {}) {
        const id = `monitor-${Date.now()}`;
        const monitorNumber = state.monitors.length + 1;
        const name = `Monitor ${monitorNumber}`;

        const monitor = {
          id,
          name,
          x: 0,
          y: 0,
          orientation: config.orientation || 'horizontal',
          aspectRatio: config.aspectRatio || '16:9',
          inches: config.inches || 24
        };

        calculateMonitorDimensions(monitor);
        state.monitors.push(monitor);
        createMonitorElement(monitor);
        renderMonitorList();
      }

      function calculateMonitorDimensions(monitor) {
        const [ratioW, ratioH] = monitor.aspectRatio.split(':').map(Number);
        const inches = monitor.inches;

        const h_inches = inches / Math.sqrt(Math.pow(ratioW / ratioH, 2) + 1);
        const w_inches = h_inches * (ratioW / ratioH);

        const scalingFactor = 20;
        const physical_w_px = w_inches * scalingFactor;
        const physical_h_px = h_inches * scalingFactor;

        monitor.width = monitor.orientation === 'horizontal' ? physical_w_px : physical_h_px;
        monitor.height = monitor.orientation === 'horizontal' ? physical_h_px : physical_w_px;
      }

      function createMonitorElement(monitor) {
        const el = document.createElement('div');
        el.id = monitor.id;
        el.className = 'monitor';
        el.style.width = `${monitor.width}px`;
        el.style.height = `${monitor.height}px`;
        el.style.transform = `translate(${monitor.x}px, ${monitor.y}px)`;

        el.innerHTML = `
          <div class="monitor-label">${monitor.name}</div>
          <button class="download-btn">
            <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M12 2.25a.75.75 0 01.75.75v11.69l3.22-3.22a.75.75 0 111.06 1.06l-4.5 4.5a.75.75 0 01-1.06 0l-4.5-4.5a.75.75 0 111.06-1.06l3.22 3.22V3a.75.75 0 01.75-.75zm-9 13.5a.75.75 0 01.75.75v2.25a1.5 1.5 0 001.5 1.5h13.5a1.5 1.5 0 001.5-1.5V16.5a.75.75 0 011.5 0v2.25a3 3 0 01-3 3H5.25a3 3 0 01-3-3V16.5a.75.75 0 01.75-.75z" clip-rule="evenodd" /></svg>
          </button>
        `;

        el.querySelector('.download-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          downloadMonitor(monitor.id);
        });

        previewContainer.appendChild(el);
      }

      function updateMonitor(monitorId, newProps) {
        const monitor = state.monitors.find((m) => m.id === monitorId);
        if (!monitor) return;

        const oldWidth = monitor.width;
        const oldHeight = monitor.height;

        Object.assign(monitor, newProps);
        calculateMonitorDimensions(monitor);

        monitor.x += (oldWidth - monitor.width) / 2;
        monitor.y += (oldHeight - monitor.height) / 2;

        const el = document.getElementById(monitor.id);
        if (el) {
          el.style.width = `${monitor.width}px`;
          el.style.height = `${monitor.height}px`;
          el.style.transform = `translate(${monitor.x}px, ${monitor.y}px)`;
          logCropCoordinates(monitor);
        }
        renderMonitorList();
      }

      function deleteMonitor(monitorId) {
        const monitorIndex = state.monitors.findIndex((m) => m.id === monitorId);
        if (monitorIndex > -1) {
          state.monitors.splice(monitorIndex, 1);
          const el = document.getElementById(monitorId);
          if (el) el.remove();
          renderMonitorList();
        }
      }

      function renderMonitorList() {
        monitorList.innerHTML = '';
        state.monitors.forEach((monitor) => {
          const monitorItem = document.createElement('div');
          monitorItem.className = 'bg-gray-800 rounded-lg p-3 space-y-3';
          monitorItem.innerHTML = `
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5 text-gray-400" viewBox="0 0 24 24" fill="currentColor"><path d="M20 3H4c-1.103 0-2 .897-2 2v10c0 1.103.897 2 2 2h7v2H8v2h8v-2h-3v-2h7c1.103 0 2-.897 2-2V5c0-1.103-.897-2-2-2zM4 15V5h16l.002 10H4z"></path></svg>
                    <span class="text-sm text-gray-300 font-medium">${monitor.name}</span>
                </div>
                <button data-monitor-id="${
                  monitor.id
                }" class="delete-monitor-btn text-gray-500 hover:text-red-500 p-1 rounded-full hover:bg-gray-700 transition-colors">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
                </button>
            </div>
            <div class="grid grid-cols-2 gap-x-4 gap-y-2 text-sm items-center">
                <label class="text-xs text-gray-400">Orientation</label>
                <select class="orientation-select w-full bg-gray-900 border border-gray-700 rounded-md px-2 py-1">
                    <option value="horizontal" ${
                      monitor.orientation === 'horizontal' ? 'selected' : ''
                    }>Horizontal</option>
                    <option value="vertical" ${
                      monitor.orientation === 'vertical' ? 'selected' : ''
                    }>Vertical</option>
                </select>
                
                <label class="text-xs text-gray-400">Aspect Ratio</label>
                <select class="aspect-ratio-select w-full bg-gray-900 border border-gray-700 rounded-md px-2 py-1">
                    <option value="16:9" ${
                      monitor.aspectRatio === '16:9' ? 'selected' : ''
                    }>16:9</option>
                    <option value="16:10" ${
                      monitor.aspectRatio === '16:10' ? 'selected' : ''
                    }>16:10</option>
                    <option value="21:9" ${
                      monitor.aspectRatio === '21:9' ? 'selected' : ''
                    }>21:9</option>
                    <option value="32:9" ${
                      monitor.aspectRatio === '32:9' ? 'selected' : ''
                    }>32:9</option>
                    <option value="4:3" ${
                      monitor.aspectRatio === '4:3' ? 'selected' : ''
                    }>4:3</option>
                </select>
                
                <label class="text-xs text-gray-400">Inches</label>
                <input type="number" class="inches-input w-full bg-gray-900 border border-gray-700 rounded-md px-2 py-1" value="${
                  monitor.inches
                }" min="1">
            </div>
        `;
          monitorList.appendChild(monitorItem);

          monitorItem
            .querySelector('.delete-monitor-btn')
            .addEventListener('click', (e) => deleteMonitor(e.currentTarget.dataset.monitorId));
          monitorItem
            .querySelector('.orientation-select')
            .addEventListener('change', (e) =>
              updateMonitor(monitor.id, { orientation: e.target.value })
            );
          monitorItem.querySelector('.inches-input').addEventListener('change', (e) =>
            updateMonitor(monitor.id, {
              inches: parseFloat(e.target.value) || 1
            })
          );
          monitorItem
            .querySelector('.aspect-ratio-select')
            .addEventListener('change', (e) =>
              updateMonitor(monitor.id, { aspectRatio: e.target.value })
            );
        });
      }

      function recenterMonitors() {
        state.monitors.forEach((monitor) => {
          monitor.x = 0;
          monitor.y = 0;

          const el = document.getElementById(monitor.id);
          if (el) {
            el.style.transform = `translate(${monitor.x}px, ${monitor.y}px)`;
          }
        });
      }

      async function downloadMonitor(monitorId) {
        if (!state.image) return;

        const monitor = state.monitors.find((m) => m.id === monitorId);
        if (!monitor) return;

        logCropCoordinates(monitor);

        const tempCanvas = document.createElement('canvas');

        const [ratioW, ratioH] = monitor.aspectRatio.split(':').map(Number);
        const outputWidth = 3840;
        const outputHeight =
          monitor.orientation === 'horizontal'
            ? (outputWidth / ratioW) * ratioH
            : (outputWidth / ratioH) * ratioW;

        tempCanvas.width = outputWidth;
        tempCanvas.height = outputHeight;

        const tCtx = tempCanvas.getContext('2d');

        const rect = previewContainer.getBoundingClientRect();
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const zoomFactor = state.zoom;
        const imageX = state.panX;
        const imageY = state.panY;
        const monitorWidth = monitor.width;
        const monitorHeight = monitor.height;
        const monitorX = centerX + monitor.x - imageX - monitorWidth / 2;
        const monitorY = centerY + monitor.y - imageY - monitorHeight / 2;

        const sourceX = monitorX / zoomFactor;
        const sourceY = monitorY / zoomFactor;
        const sourceWidth = monitorWidth / zoomFactor;
        const sourceHeight = monitorHeight / zoomFactor;

        tCtx.drawImage(
          state.image,
          sourceX,
          sourceY,
          sourceWidth,
          sourceHeight,
          0,
          0,
          outputWidth,
          outputHeight
        );

        const blob = await new Promise((resolve) => tempCanvas.toBlob(resolve, 'image/jpeg', 1.0));
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        const lastDotIndex = state.imageName.lastIndexOf('.');
        const imageNameWithoutExtension =
          lastDotIndex === -1 ? state.imageName : state.imageName.substring(0, lastDotIndex);
        a.download = `${imageNameWithoutExtension}_${monitor.name}.jpg`;
        a.click();
        URL.revokeObjectURL(a.href);
      }

      function logCropCoordinates(monitor) {
        if (!state.image) return;

        const rect = previewContainer.getBoundingClientRect();
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const zoomFactor = state.zoom;

        const sourceWidth = state.image.width;
        const sourceHeight = state.image.height;

        const imageX = state.panX;
        const imageY = state.panY;
        const imageWidth = sourceWidth * zoomFactor;
        const imageHeight = sourceHeight * zoomFactor;

        const monitorWidth = monitor.width;
        const monitorHeight = monitor.height;
        const monitorX = centerX + monitor.x - imageX - monitorWidth / 2;
        const monitorY = centerY + monitor.y - imageY - monitorHeight / 2;

        console.log({
          monitor: monitor,
          source: {
            h: sourceHeight,
            w: sourceWidth,
            f: zoomFactor
          },
          image: {
            h: imageHeight,
            w: imageWidth,
            x: imageX,
            y: imageY
          },
          crop: {
            h: monitorHeight / zoomFactor,
            w: monitorWidth / zoomFactor,
            x: monitorX / zoomFactor,
            y: monitorY / zoomFactor
          }
        });
      }

      function initInteractions() {
        interact('.monitor').draggable({
          listeners: {
            move(event) {
              const monitor = state.monitors.find((m) => m.id === event.target.id);
              if (monitor) {
                monitor.x += event.dx;
                monitor.y += event.dy;
                event.target.style.transform = `translate(${monitor.x}px, ${monitor.y}px)`;
              }
            },
            end(event) {
              const monitor = state.monitors.find((m) => m.id === event.target.id);
              if (monitor) {
                logCropCoordinates(monitor);
              }
            }
          },
          modifiers: [
            interact.modifiers.snap({
              targets: [interact.snappers.grid({ x: 10, y: 10 })]
            })
          ],
          inertia: true
        });

        interact(previewContainer).draggable({
          listeners: {
            move: function (event) {
              if (state.image) {
                state.panX += event.dx;
                state.panY += event.dy;
                updateBackgroundTransform();
              }
            },
            end: function (event) {
              if (state.image) {
                state.monitors.forEach(logCropCoordinates);
              }
            }
          }
        });

        previewContainer.addEventListener('wheel', (event) => {
          if (state.image) {
            event.preventDefault();

            const rect = previewContainer.getBoundingClientRect();
            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;

            const zoomDelta = event.deltaY * -0.01;
            const newZoom = state.zoom * Math.exp(zoomDelta);
            const zoomFactor = newZoom / state.zoom;

            state.panX = mouseX - (mouseX - state.panX) * zoomFactor;
            state.panY = mouseY - (mouseY - state.panY) * zoomFactor;

            setZoom(newZoom);
          }
        });
      }

      // --- Init ---
      dropZone.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', handleFileSelect);
      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('border-blue-500', 'bg-gray-800');
      });
      dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('border-blue-500', 'bg-gray-800');
      });
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('border-blue-500', 'bg-gray-800');
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          handleFile(e.dataTransfer.files[0]);
        }
      });

      removeImageBtn.addEventListener('click', removeImage);

      zoomInput.addEventListener('change', (e) => {
        setZoom(parseFloat(e.target.value) / 100, true);
        zoomRange.value = e.target.value;
      });

      zoomRange.addEventListener('input', (e) => {
        setZoom(parseFloat(e.target.value) / 100, true);
        zoomInput.value = e.target.value;
      });

      addMonitorBtn.addEventListener('click', () => addMonitor());

      window.addEventListener('load', () => {
        addMonitor();
        initInteractions();
        window.addEventListener('resize', recenterMonitors);
      });
    </script>
  </body>
</html>
